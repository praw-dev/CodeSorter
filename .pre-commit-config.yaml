repos:
  - hooks:
      # Self-hosted: run codesorter from the local checkout rather than a pinned
      # release so the repository is always sorted by its own current code.
      - entry: codesorter
        exclude: ^(examples|tests/test_files)/
        id: codesorter
        language: system
        name: codesorter
        require_serial: true
        types: [python]
    repo: local

  - hooks:
      - id: docstrfmt
        require_serial: true
    repo: https://github.com/LilSpazJoekp/docstrfmt
    rev: c1813841673cdcd6cf602dde1edb78a5d5e45235  # frozen: v2.2.1

  - hooks:
      - id: auto-walrus
    repo: https://github.com/MarcoGorelli/auto-walrus
    rev: 1743edbed52f3d61886b59d98a27164a8af29c0d  # frozen: 0.4.1

  - hooks:
      - args: [ --exit-non-zero-on-fix, --fix ]
        id: ruff
      - id: ruff-format
    repo: https://github.com/astral-sh/ruff-pre-commit
    rev: e8f7d69b957a30acb2c875078d5fd012de24b64c  # frozen: v0.16.7

  - hooks:
      - files: ^(.*\.toml)$
        id: toml-sort-fix
    repo: https://github.com/pappasam/toml-sort
    rev: 6bcff12c5d156baa6897ca2a85f6d534af296e7c  # frozen: v0.25.0

  - hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - args: [ --fix=lf ]
        id: mixed-line-ending
      - args: [ --pytest-test-first ]
        files: ^tests/(integration|unit)/.*\.py$
        id: name-tests-test
      - id: no-commit-to-branch
      - files: ^(\.github/workflows/.*\.ya?ml|\.readthedocs.ya?ml)$
        id: sort-simple-yaml
      - id: trailing-whitespace
    repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
